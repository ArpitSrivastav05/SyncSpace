services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace_dev
      POSTGRES_DB: syncspace
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata:
